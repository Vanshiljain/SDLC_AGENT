name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Test-only secrets — never used outside CI.
  JWT_SECRET: ci-jwt-secret-0123456789-abcdefghijklmnopqrstuv
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-abcdefghijklmnop
  ENCRYPTION_KEYS: '1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
  DATABASE_URL: postgresql://forgeline:forgeline@localhost:5432/forgeline
  REDIS_URL: redis://localhost:6379
  QDRANT_URL: http://localhost:6333

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build

  integration:
    name: Integration & acceptance (API + browser)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgeline
          POSTGRES_PASSWORD: forgeline
          POSTGRES_DB: forgeline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgeline" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@forgeline/api... --filter=@forgeline/web...
      - name: Apply migrations and seed
        run: |
          pnpm --filter @forgeline/database exec prisma migrate deploy
          node packages/database/dist/seed.js
      - name: API integration tests (real Postgres/Redis)
        run: pnpm --filter @forgeline/api exec jest --config jest.config.js --selectProjects integration --runInBand
      - name: Acceptance scenario through the API (mock SaaS, real sandbox)
        working-directory: e2e
        run: pnpm exec tsx --test --test-reporter=spec scenario/acceptance.test.ts
        env:
          SANDBOX_DRIVER: local
      - name: Install Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance scenario in the browser
        working-directory: e2e
        run: pnpm exec playwright test
        env:
          CI: 'true'
          SANDBOX_DRIVER: local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          push: false
          cache-from: type=gha,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
